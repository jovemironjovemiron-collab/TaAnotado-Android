name: Build TáAnotado V17 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte V17
        run: |
          unzip -q taanotado-v17-build.zip -d full
          cp voice-server/mobile-api.mjs full/worker/mobile-api.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('full/scripts/prepare-android-web.mjs')
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if not line.startswith('for (const image')))
          PY
      - name: Preparar instalação de teste sem conflito
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('full/android/app/build.gradle')
          p.write_text(p.read_text().replace('applicationId "com.organizae.app"', 'applicationId "com.organizae.app.v17"'))
          p=Path('full/capacitor.config.json')
          data=json.loads(p.read_text())
          data['appId']='com.organizae.app.v17'
          data['appName']='TáAnotado 17'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2))
          p=Path('full/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('TáAnotado 15', 'TáAnotado 17'))
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.android/taanotado-test.keystore
          key: taanotado-v17-test-signing-v1
      - name: Garantir assinatura de teste persistente
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/taanotado-test.keystore ]; then
            keytool -genkeypair -keystore ~/.android/taanotado-test.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=TaAnotado Test" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: full/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar e preparar aplicativo
        working-directory: full
        run: |
          npm ci
          npm test
          npm run android:sync
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: full/android
        run: gradle assembleDebug
      - name: Preparar arquivo para instalar
        run: cp full/android/app/build/outputs/apk/debug/app-debug.apk TaAnotado-v17.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaAnotado-v17-APK
          path: TaAnotado-v17.apk
          if-no-files-found: error
