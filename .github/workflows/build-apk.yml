name: Build TáAnotado V15 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte V15
        run: unzip -q taanotado-v15-build.zip -d full
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: full/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Validar e preparar aplicativo
        working-directory: full
        run: |
          npm ci
          npm test
          npm run android:sync
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: full/android
        run: gradle assembleDebug
      - name: Preparar arquivo para instalar
        run: cp full/android/app/build/outputs/apk/debug/app-debug.apk TaAnotado-v15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaAnotado-v15-APK
          path: TaAnotado-v15.apk
          if-no-files-found: error
