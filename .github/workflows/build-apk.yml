name: Build TáAnotado V19 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte V17 como base da V19
        run: |
          unzip -q taanotado-v17-build.zip -d full
          cp voice-server/mobile-api.mjs full/worker/mobile-api.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('full/scripts/prepare-android-web.mjs')
          p.write_text('\\n'.join(line for line in p.read_text().splitlines() if not line.startswith('for (const image')))
          PY
      - name: Preparar identidade V19
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('full/android/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'applicationId\\s+["\\\']com\\.organizae\\.app(?:\\.v\\d+)?["\\\']', 'applicationId "com.organizae.app.v19"', s)
          if n != 1: raise SystemExit(f'applicationId não corrigido: {n}')
          p.write_text(s)
          p=Path('full/capacitor.config.json')
          d=json.loads(p.read_text())
          d['appId']='com.organizae.app.v19'
          d['appName']='TáAnotado 19'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          p=Path('full/android/app/src/main/res/values/strings.xml')
          s=p.read_text()
          s=re.sub(r'TáAnotado(?:\\s+\\d+)?','TáAnotado 19',s)
          p.write_text(s)
          PY
      - name: Corrigir permissões nativas de áudio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('full/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms=['android.permission.RECORD_AUDIO','android.permission.MODIFY_AUDIO_SETTINGS','android.permission.INTERNET']
          add=''
          for perm in perms:
              if perm not in s: add += '\\n    <uses-permission android:name="'+perm+'" />'
          if add:
              i=s.find('>')
              if i < 0: raise SystemExit('AndroidManifest inválido')
              s=s[:i+1]+add+s[i+1:]
          p.write_text(s)
          PY
      - name: Garantir pedido runtime de microfone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates=list(Path('full/android/app/src/main/java').rglob('MainActivity.java'))
          if not candidates: raise SystemExit('MainActivity.java não encontrado')
          p=candidates[0]
          s=p.read_text()
          if 'Manifest.permission.RECORD_AUDIO' not in s:
              s=s.replace('import android.os.Bundle;', 'import android.os.Bundle;\\nimport android.Manifest;\\nimport android.content.pm.PackageManager;')
              needle='super.onCreate(savedInstanceState);'
              repl=needle+'\\n        if (android.os.Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\\n            requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 901);\\n        }'
              if needle not in s: raise SystemExit('onCreate não encontrado')
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
      - name: Remover chamada a plugin Microphone inexistente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for p in Path('full').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.ts','.tsx','.js','.jsx','.mjs'}: continue
              if any(x in p.parts for x in ('node_modules','android','dist','dist-android')): continue
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              if '.ensurePermission()' not in s: continue
              old=s
              s=re.sub(r'if\\s*\\([^{};\\n]*isNativePlatform\\(\\)[^{};\\n]*\\)\\s*\\{\\s*await\\s+[A-Za-z_$][\\w$]*\\.ensurePermission\\(\\)\\s*;?\\s*\\}','',s,flags=re.S)
              s=re.sub(r'if\\s*\\([^;\\n]*isNativePlatform\\(\\)[^;\\n]*\\)\\s*await\\s+[A-Za-z_$][\\w$]*\\.ensurePermission\\(\\)\\s*;?','',s)
              if s != old:
                  p.write_text(s)
                  changed.append(str(p))
          if not changed: raise SystemExit('chamada ensurePermission não localizada')
          print('Corrigido:', changed)
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.android/taanotado-test.keystore
          key: taanotado-v19-test-signing-v1
      - name: Garantir assinatura de teste persistente
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/taanotado-test.keystore ]; then
            keytool -genkeypair -keystore ~/.android/taanotado-test.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=TaAnotado Test" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: full/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Testar e sincronizar Android
        working-directory: full
        run: |
          npm ci
          npm test
          npm run android:sync
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: full/android
        run: gradle assembleDebug
      - name: Validar APK final
        run: |
          APK=full/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -q "package: name='com.organizae.app.v19'" /tmp/badging.txt
          grep -q 'android.permission.RECORD_AUDIO' /tmp/permissions.txt
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' /tmp/permissions.txt
          echo 'APK V19 validado.'
      - name: Preparar arquivo para instalar
        run: cp full/android/app/build/outputs/apk/debug/app-debug.apk TaAnotado-v19.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaAnotado-v19-APK
          path: TaAnotado-v19.apk
          if-no-files-found: error
