name: Build TáAnotado V15 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair fonte V15
        run: unzip -q taanotado-v15-build.zip -d full
      - name: Preparar instalação de teste sem conflito
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('full/android/app/build.gradle')
          p.write_text(p.read_text().replace('applicationId "com.organizae.app"', 'applicationId "com.organizae.app.v15"'))
          p=Path('full/capacitor.config.json')
          data=json.loads(p.read_text())
          data['appId']='com.organizae.app.v15'
          data['appName']='TáAnotado 15'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2))
          p=Path('full/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('TáAnotado', 'TáAnotado 15'))
          PY
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: taanotado-v15-debug-signing-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: full/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar e preparar aplicativo
        working-directory: full
        run: |
          npm ci
          npm test
          npm run android:sync
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: full/android
        run: gradle assembleDebug
      - name: Preparar arquivo para instalar
        run: cp full/android/app/build/outputs/apk/debug/app-debug.apk TaAnotado-v15.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TaAnotado-v15-APK
          path: TaAnotado-v15.apk
          if-no-files-found: error
